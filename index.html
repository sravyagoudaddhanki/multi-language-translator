<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarvam AI Translator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .api-section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .language-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        textarea {
            resize: vertical;
            min-height: 150px;
            font-family: inherit;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .translate-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .translate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .translate-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .clear-btn {
            background: #f0f0f0;
            color: #333;
        }

        .clear-btn:hover {
            background: #e0e0e0;
        }

        .result-section {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        .result-section.active {
            display: block;
        }

        .result-text {
            color: #333;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .error {
            color: #dc3545;
            padding: 15px;
            background: #f8d7da;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .error.active {
            display: block;
        }

        .loading {
            text-align: center;
            color: #667eea;
            display: none;
            margin-top: 15px;
        }

        .loading.active {
            display: block;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 0.85em;
            color: #555;
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            .language-row {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Sarvam AI Translator</h1>
        <p class="subtitle">Translate text across 22+ Indian languages</p>

        <div class="info-box">
            📝 Get your API key from <a href="https://dashboard.sarvam.ai/" target="_blank">Sarvam AI Dashboard</a>
        </div>

        <div class="api-section">
            <label for="apiKey">API Key:</label>
            <input type="text" id="apiKey" placeholder="Enter your Sarvam AI API key" />
        </div>

        <div class="language-row">
            <div>
                <label for="sourceLanguage">Source Language:</label>
                <select id="sourceLanguage">
                    <option value="auto">Auto-detect</option>
                    <option value="en-IN">English</option>
                    <option value="hi-IN">Hindi (हिन्दी)</option>
                    <option value="bn-IN">Bengali (বাংলা)</option>
                    <option value="ta-IN">Tamil (தமிழ்)</option>
                    <option value="te-IN">Telugu (తెలుగు)</option>
                    <option value="mr-IN">Marathi (मराठी)</option>
                    <option value="gu-IN">Gujarati (ગુજરાતી)</option>
                    <option value="kn-IN">Kannada (ಕನ್ನಡ)</option>
                    <option value="ml-IN">Malayalam (മലയാളം)</option>
                    <option value="pa-IN">Punjabi (ਪੰਜਾਬੀ)</option>
                    <option value="od-IN">Odia (ଓଡ଼ିଆ)</option>
                    <option value="as-IN">Assamese (অসমীয়া)</option>
                    <option value="brx-IN">Bodo</option>
                    <option value="doi-IN">Dogri</option>
                    <option value="kok-IN">Konkani</option>
                    <option value="ks-IN">Kashmiri</option>
                    <option value="mai-IN">Maithili</option>
                    <option value="mni-IN">Manipuri</option>
                    <option value="ne-IN">Nepali</option>
                    <option value="sa-IN">Sanskrit</option>
                    <option value="sat-IN">Santali</option>
                    <option value="sd-IN">Sindhi</option>
                    <option value="ur-IN">Urdu (اردو)</option>
                </select>
            </div>

            <div>
                <label for="targetLanguage">Target Language:</label>
                <select id="targetLanguage">
                    <option value="en-IN">English</option>
                    <option value="hi-IN">Hindi (हिन्दी)</option>
                    <option value="bn-IN">Bengali (বাংলা)</option>
                    <option value="ta-IN">Tamil (தமிழ்)</option>
                    <option value="te-IN">Telugu (తెలుగు)</option>
                    <option value="mr-IN">Marathi (मराठी)</option>
                    <option value="gu-IN">Gujarati (ગુજરાતી)</option>
                    <option value="kn-IN">Kannada (ಕನ್ನಡ)</option>
                    <option value="ml-IN">Malayalam (മലയാളം)</option>
                    <option value="pa-IN">Punjabi (ਪੰਜਾਬੀ)</option>
                    <option value="od-IN">Odia (ଓଡ଼ିଆ)</option>
                    <option value="as-IN">Assamese (অসমীয়া)</option>
                    <option value="brx-IN">Bodo</option>
                    <option value="doi-IN">Dogri</option>
                    <option value="kok-IN">Konkani</option>
                    <option value="ks-IN">Kashmiri</option>
                    <option value="mai-IN">Maithili</option>
                    <option value="mni-IN">Manipuri</option>
                    <option value="ne-IN">Nepali</option>
                    <option value="sa-IN">Sanskrit</option>
                    <option value="sat-IN">Santali</option>
                    <option value="sd-IN">Sindhi</option>
                    <option value="ur-IN">Urdu (اردو)</option>
                </select>
            </div>
        </div>

        <div>
            <label for="inputText">Text to Translate:</label>
            <textarea id="inputText" placeholder="Enter text here..."></textarea>
        </div>

        <div class="button-group">
            <button class="translate-btn" onclick="translateText()">Translate</button>
            <button class="clear-btn" onclick="clearAll()">Clear</button>
        </div>

        <div class="loading" id="loading">
            <p>⏳ Translating...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="result-section" id="resultSection">
            <h3 style="margin-bottom: 15px; color: #667eea;">Translation:</h3>
            <div class="result-text" id="resultText"></div>
        </div>
    </div>

    <script>
        async function translateText() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const sourceLanguage = document.getElementById('sourceLanguage').value;
            const targetLanguage = document.getElementById('targetLanguage').value;
            const inputText = document.getElementById('inputText').value.trim();
            
            const errorDiv = document.getElementById('error');
            const resultSection = document.getElementById('resultSection');
            const resultText = document.getElementById('resultText');
            const loading = document.getElementById('loading');
            
            // Clear previous results
            errorDiv.classList.remove('active');
            resultSection.classList.remove('active');
            
            // Validation
            if (!apiKey) {
                showError('Please enter your API key');
                return;
            }
            
            if (!inputText) {
                showError('Please enter text to translate');
                return;
            }
            
            if (sourceLanguage === targetLanguage && sourceLanguage !== 'auto') {
                showError('Source and target languages cannot be the same');
                return;
            }
            
            // Show loading
            loading.classList.add('active');
            
            try {
                const response = await fetch('https://api.sarvam.ai/translate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'api-subscription-key': apiKey
                    },
                    body: JSON.stringify({
                        input: inputText,
                        source_language_code: sourceLanguage,
                        target_language_code: targetLanguage,
                        model: 'mayura:v1',
                        enable_preprocessing: true
                    })
                });
                
                loading.classList.remove('active');
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.message || `API Error: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.translated_text) {
                    resultText.textContent = data.translated_text;
                    resultSection.classList.add('active');
                } else {
                    showError('No translation returned from API');
                }
                
            } catch (error) {
                loading.classList.remove('active');
                showError(error.message || 'Translation failed. Please check your API key and try again.');
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
        }
        
        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('resultSection').classList.remove('active');
            document.getElementById('error').classList.remove('active');
            document.getElementById('loading').classList.remove('active');
        }
        
        // Allow Enter key to translate (Ctrl+Enter in textarea)
        document.getElementById('inputText').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                translateText();
            }
        });
    </script>
</body>
</html>
